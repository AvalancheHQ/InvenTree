name: CodSpeed Benchmarks
'on':
  push:
    branches:
    - master
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
  id-token: write
jobs:
  benchmarks:
    name: Run Benchmarks
    runs-on: ubuntu-24.04
    env:
      INVENTREE_DB_ENGINE: sqlite3
      INVENTREE_DB_NAME: ./inventree_benchmark.sqlite
      INVENTREE_DEBUG: false
      INVENTREE_LOG_LEVEL: WARNING
      INVENTREE_PLUGINS_ENABLED: false
      INVENTREE_CONSOLE_LOG: false
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: Install system dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y gettext poppler-utils

        '
    - name: Install Python dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r src/backend/requirements.txt

        pip install -r src/backend/requirements-dev.txt

        '
    - name: Setup Django environment
      run: 'cd src/backend/InvenTree

        python manage.py migrate --noinput

        python manage.py collectstatic --noinput

        '
    - name: Run benchmarks
      uses: CodSpeedHQ/action@v4
      with:
        upload-url: ${{ secrets.CODSPEED_FRANCOIS_DEV_UPLOAD_URL }}
        mode: simulation
        run: 'cd src/backend/InvenTree

          pytest part/test_benchmark_part.py part/test_benchmark_api.py --codspeed

          '
