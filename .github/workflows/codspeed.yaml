name: CodSpeed
'on':
  push:
    branches:
    - master
  pull_request: null
  workflow_dispatch: null
env:
  python_version: 3.11
permissions:
  contents: read
  id-token: write
jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-24.04
    env:
      INVENTREE_DB_ENGINE: sqlite3
      INVENTREE_DB_NAME: ./inventree_benchmark.sqlite
      INVENTREE_DEBUG: false
      INVENTREE_LOG_LEVEL: WARNING
      INVENTREE_PLUGINS_ENABLED: false
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      with:
        persist-credentials: false
    - name: Set up Python ${{ env.python_version }}
      uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
      with:
        python-version: ${{ env.python_version }}
        cache: pip
    - name: Install system dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y gettext poppler-utils

        '
    - name: Install Python dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r src/backend/requirements.txt

        pip install pytest-codspeed==4.2.0

        '
    - name: Setup Django
      run: 'cd src/backend

        python manage.py migrate --noinput

        python manage.py collectstatic --noinput

        '
    - name: Run benchmarks
      uses: CodSpeedHQ/action@4e43b5a97f4ce5c3611d88b5d4d1bb6a2f8b0e15
      with:
        upload-url: ${{ secrets.CODSPEED_FRANCOIS_DEV_UPLOAD_URL }}
        mode: simulation
        run: pytest benchmarks/ --codspeed
